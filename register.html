<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Join PARC — Register</title>
  <link rel="stylesheet" href="parc.css" />
  <style>
    .auth-page { justify-content: flex-start; padding-top: 48px; padding-bottom: 48px; }
  </style>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">
      <div class="auth-logo-icon">
        <svg viewBox="0 0 24 24" fill="white"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
      </div>
      <div class="auth-logo-text">
        <h1>PARC</h1>
        <span>Philadelphia Amateur Radio</span>
      </div>
    </a>

    <div class="auth-header">
      <h2>Join PARC</h2>
      <p>Already a member? <a href="login.html">Sign in here</a></p>
    </div>

    <!-- Membership tiers (compact) -->
    <div style="display:flex;gap:8px;margin-bottom:24px">
      <div style="flex:1;background:rgba(255,106,0,0.1);border:1px solid rgba(255,106,0,0.2);border-radius:12px;padding:10px;text-align:center">
        <div style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--orange)">$35</div>
        <div style="font-size:0.68rem;color:var(--text2)">Full/yr</div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center">
        <div style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text)">$20</div>
        <div style="font-size:0.68rem;color:var(--text2)">Student/yr</div>
      </div>
      <div style="flex:1;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center">
        <div style="font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text)">$55</div>
        <div style="font-size:0.68rem;color:var(--text2)">Family/yr</div>
      </div>
    </div>

    <div class="social-btns">
      <button class="social-btn" onclick="handleSocialReg('google')">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Sign up with Google
      </button>
      <button class="social-btn" onclick="handleSocialReg('apple')">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--text)">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        Sign up with Apple
      </button>
    </div>

    <div class="divider">or register with your callsign</div>

    <div id="error-msg" class="error-msg"></div>
    <div id="success-msg" class="success-msg"></div>

    <form id="register-form" onsubmit="handleRegister(event)">

      <div class="section-title">Personal Information</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="fname">First Name</label>
          <input class="form-input" type="text" id="fname" placeholder="Jane" required autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="lname">Last Name</label>
          <input class="form-input" type="text" id="lname" placeholder="Smith" required autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" placeholder="jane@example.com" required autocomplete="email" />
      </div>

      <div class="section-title">Amateur Radio Details</div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="callsign">Callsign</label>
          <input class="form-input" type="text" id="callsign" placeholder="KD3XYZ"
            style="font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.05em"
            oninput="this.value=this.value.toUpperCase()" autocomplete="off" />
          <div class="callsign-hint">Leave blank if not yet licensed</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="license">License Class</label>
          <select class="form-select" id="license">
            <option value="">Not yet licensed</option>
            <option value="tech">Technician</option>
            <option value="general">General</option>
            <option value="extra">Amateur Extra</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="membership">Membership Type</label>
        <select class="form-select" id="membership" required>
          <option value="">Select membership type…</option>
          <option value="full">Full Membership — $35/yr</option>
          <option value="student">Student Membership — $20/yr</option>
          <option value="family">Family Membership — $55/yr</option>
        </select>
      </div>

      <div class="section-title">Account Security</div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" placeholder="Minimum 8 characters"
          autocomplete="new-password" oninput="updateStrength(this.value)" required />
        <div class="password-strength">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <div class="strength-label" id="strength-label">Enter a password</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm">Confirm Password</label>
        <input class="form-input" type="password" id="confirm" placeholder="Repeat password" autocomplete="new-password" required />
      </div>

      <label class="terms-check">
        <input type="checkbox" id="terms" required />
        I agree to the <a href="#">PARC Terms of Membership</a> and <a href="#">Privacy Policy</a>. I certify that all information provided is accurate.
      </label>

      <button type="submit" class="btn-submit" id="submit-btn">Create My PARC Account</button>
    </form>

    <a href="index.html" class="back-link">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to main site
    </a>
  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
